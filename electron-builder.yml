appId: app.xrncal.desktop
productName: xrncal
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: xrncal

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office;Calendar;
  synopsis: Modern desktop calendar with multi-provider sync
  description: xrncal desktop client for Windows and Linux
  icon: resources/icon.png
