appId: app.xrncal.desktop
productName: xrncal
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json

# Where installed builds look for updates (src/main/updater.ts). A tagged push
# runs .github/workflows/release.yml, which uploads the installers and the
# latest*.yml files electron-updater reads to a draft release; publishing that
# draft is what ships it.
publish:
  provider: github
  owner: Xernnn
  repo: xrncal-desktop
  releaseType: draft

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: xrncal

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office;Calendar;
  # Electron 38+ runs as a native Wayland client in a Wayland session, where a
  # window cannot place itself or stay on top - the tray's mini window does
  # both. XWayland keeps them working; this has to be a command-line switch, as
  # app.commandLine.appendSwitch() runs too late to choose the platform.
  executableArgs:
    - --ozone-platform=x11
  synopsis: Modern desktop calendar with multi-provider sync
  description: xrncal desktop client for Windows and Linux
  icon: resources/icon.png
